spring.application.name=TripCast

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/TripCast?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

weather.api.base-url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
weather.api.key=${WEATHER_API_KEY}
weather.api.connect-timeout=3s
weather.api.read-timeout=5s
# 동네예보 캐시(격자 단위). 예보는 3시간마다 발표되므로 30분 재사용은 안전하다.
weather.cache.ttl-minutes=30
weather.cache.max-size=1000
# 코스 날씨 조회 시 기상청 동시 호출 수 상한(스레드풀 크기)
weather.parallelism=4

# 외부 API 호출 중에 DB 커넥션을 붙잡지 않도록 요청 전체에 걸친 세션 유지(OSIV)를 끈다.
spring.jpa.open-in-view=false

tour-climate.api.base-url=https://apis.data.go.kr/1360000/TourStnInfoService1
tour-climate.api.key=${TOUR_CLIMATE_API_KEY}
tour-climate.api.connect-timeout=3s
tour-climate.api.read-timeout=5s

# 수동 동기화 API와 자동 배치는 별도로 켠다. 구 변수 CLIMATE_INDEX_SYNC_ENABLED는 두 값의 기본값으로만 쓰인다.
app.climate-index-sync.api-enabled=${CLIMATE_INDEX_SYNC_API_ENABLED:${CLIMATE_INDEX_SYNC_ENABLED:false}}
app.climate-index-sync.scheduler-enabled=${CLIMATE_INDEX_SYNC_SCHEDULER_ENABLED:${CLIMATE_INDEX_SYNC_ENABLED:false}}
app.climate-index-sync.cron=0 0 5 * * *
app.climate-index-sync.zone=Asia/Seoul
app.climate-index-sync.forecast-days=1

app.tour-spot-import.enabled=false

# 지역 이름(regions.csv) 적재. 재실행해도 결과가 같은 upsert라 기본값은 켜 둔다.
app.region-import.enabled=${REGION_IMPORT_ENABLED:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173}

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
