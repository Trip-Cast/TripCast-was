spring.application.name=TripCast

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/TripCast?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

weather.api.base-url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
weather.api.key=${WEATHER_API_KEY}

tour-climate.api.base-url=https://apis.data.go.kr/1360000/TourStnInfoService1
tour-climate.api.key=${TOUR_CLIMATE_API_KEY}
tour-climate.api.connect-timeout=3s
tour-climate.api.read-timeout=5s

app.climate-index-sync.enabled=false
app.climate-index-sync.cron=0 0 5 * * *
app.climate-index-sync.zone=Asia/Seoul
app.climate-index-sync.forecast-days=1

app.tour-spot-import.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
