spring.application.name=TripCast-test

spring.datasource.url=jdbc:h2:mem:tripcast;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

weather.api.base-url=http://127.0.0.1:9
weather.api.key=test-key

tour-climate.api.base-url=http://127.0.0.1:9
tour-climate.api.key=test-key
tour-climate.api.connect-timeout=100ms
tour-climate.api.read-timeout=100ms

app.climate-index-sync.enabled=false

app.tour-spot-import.enabled=false

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173

jwt.secret=test-jwt-secret-key-for-signing-minimum-256-bits-required-000
jwt.expiration-minutes=60

admin.username=test-admin
admin.password=test-admin-password

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
